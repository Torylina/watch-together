<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смотрим вместе</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
         background: #ffe3f0; color: #4a1030; font-family: system-ui, sans-serif; }
  header { display: flex; gap: 8px; padding: 10px; background: #ff7eb6; align-items: center; }
  header input { flex: 1; font-size: 16px; padding: 10px 12px; border: 0; border-radius: 8px; background: #fff0f7; color: #4a1030; }
  header input::placeholder, form input::placeholder { color: #b0668a; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: #e0307f; color: #fff; cursor: pointer; }
  button:hover { background: #f0509a; }
  main { flex: 1; display: flex; min-height: 0; }
  #playerWrap { flex: 1; background: #000; min-width: 0; }
  #player { width: 100%; height: 100%; }
  aside { width: 320px; display: flex; flex-direction: column; background: #ffc9e2; }
  #info { padding: 10px; font-size: 14px; border-bottom: 1px solid #ff9cc8; }
  #msgs { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { background: #fff0f7; padding: 8px 10px; border-radius: 10px; word-break: break-word; }
  .msg b { display: block; font-size: 12px; color: #d02a78; }
  form { display: flex; gap: 6px; padding: 10px; }
  form input { flex: 1; font-size: 16px; padding: 10px; border: 0; border-radius: 8px; background: #fff0f7; color: #4a1030; }
  @media (max-width: 800px) {
    header { flex-wrap: wrap; padding: 8px; gap: 6px; }
    header input { flex: 1 1 100%; }
    header button { flex: 1; padding: 10px 8px; font-size: 14px; }
    main { flex-direction: column; }
    #playerWrap { flex: none; width: 100%; aspect-ratio: 16 / 9; }
    aside { width: 100%; flex: 1; min-height: 0; }
    #info { padding: 6px 10px; font-size: 13px; }
    form { padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<header>
  <input id="url" placeholder="Вставьте ссылку на YouTube-видео">
  <button id="load">Смотреть</button>
  <button id="copy">Скопировать ссылку на комнату</button>
</header>
<main>
  <div id="playerWrap"><div id="player"></div></div>
  <aside>
    <div id="info">В комнате: <span id="count">1</span></div>
    <div id="msgs"></div>
    <form id="chatForm">
      <input id="chatInput" placeholder="Сообщение..." autocomplete="off" maxlength="500">
      <button>→</button>
    </form>
  </aside>
</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const roomId = location.pathname.split('/')[2];
let name = localStorage.getItem('wt-name');
if (!name) { name = prompt('Ваше имя?') || 'Гость' + Math.floor(Math.random() * 100); localStorage.setItem('wt-name', name); }

let ws, player, ready = false, currentVideo = null, pending = null;
let applying = false, applyTimer;
let lastTime = 0, lastTs = Date.now(), lastPlaying = false;

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + roomId);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') applyState(m);
    else if (m.type === 'chat') addMsg(m.name, m.text);
    else if (m.type === 'users') document.getElementById('count').textContent = m.count;
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    host: 'https://www.youtube.com',
    playerVars: { playsinline: 1, rel: 0, origin: location.origin },
    events: {
      onReady: () => { ready = true; if (pending) { applyState(pending); pending = null; } },
      onStateChange: onPlayerState
    }
  });
}

function lockApplying() {
  applying = true;
  clearTimeout(applyTimer);
  applyTimer = setTimeout(() => { applying = false; }, 1200);
}

function applyState(s) {
  if (!ready) { pending = s; return; }
  if (!s.videoId) return;
  lockApplying();
  if (s.videoId !== currentVideo) {
    currentVideo = s.videoId;
    if (s.playing) player.loadVideoById(s.videoId, s.time);
    else player.cueVideoById(s.videoId, s.time);
  } else {
    if (Math.abs(player.getCurrentTime() - s.time) > 1) player.seekTo(s.time, true);
    if (s.playing) player.playVideo(); else player.pauseVideo();
  }
  lastTime = s.time; lastTs = Date.now(); lastPlaying = s.playing;
}

function pushState() {
  const t = player.getCurrentTime();
  const playing = player.getPlayerState() === YT.PlayerState.PLAYING;
  lastTime = t; lastTs = Date.now(); lastPlaying = playing;
  send({ type: 'state', videoId: currentVideo, playing, time: t });
}

function onPlayerState(e) {
  if (applying) return;
  if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.PAUSED) pushState();
}

// В YouTube API нет события перемотки — ловим скачок времени
setInterval(() => {
  if (!ready || applying || !currentVideo) return;
  const cur = player.getCurrentTime();
  const expected = lastPlaying ? lastTime + (Date.now() - lastTs) / 1000 : lastTime;
  if (Math.abs(cur - expected) > 1.5) pushState();
}, 500);

function parseYouTubeId(u) {
  const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}
document.getElementById('load').onclick = () => {
  const id = parseYouTubeId(document.getElementById('url').value.trim());
  if (!id) return alert('Не удалось распознать ссылку на YouTube');
  currentVideo = id;
  lockApplying();
  if (ready) player.loadVideoById(id, 0);
  lastTime = 0; lastTs = Date.now(); lastPlaying = true;
  send({ type: 'state', videoId: id, playing: true, time: 0 });
  document.getElementById('url').value = '';
};
document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(location.href);
  document.getElementById('copy').textContent = 'Скопировано!';
  setTimeout(() => document.getElementById('copy').textContent = 'Скопировать ссылку на комнату', 1500);
};

function addMsg(n, text) {
  const box = document.getElementById('msgs');
  const d = document.createElement('div'); d.className = 'msg';
  const b = document.createElement('b'); b.textContent = n;
  const t = document.createElement('span'); t.textContent = text;
  d.append(b, t); box.append(d);
  box.scrollTop = box.scrollHeight;
}
document.getElementById('chatForm').onsubmit = (e) => {
  e.preventDefault();
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  send({ type: 'chat', name, text });
  addMsg(name, text);
  inp.value = '';
};

connect();
</script>
</body>
</html>
