<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смотрим вместе</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
         background: #ffe3f0; color: #4a1030; font-family: system-ui, sans-serif; }
  header { display: flex; gap: 8px; padding: 10px; background: #ff7eb6; align-items: center; }
  header input { flex: 1; font-size: 16px; padding: 10px 12px; border: 0; border-radius: 8px; background: #fff0f7; color: #4a1030; }
  header input::placeholder, form input::placeholder { color: #b0668a; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: #e0307f; color: #fff; cursor: pointer; }
  button:hover { background: #f0509a; }
  main { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  #playerWrap { flex: 1; background: #000; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
  #ytBox, #vkBox { position: absolute; inset: 0; }
  #ytBox iframe, #vkBox iframe { width: 100%; height: 100%; border: 0; display: block; }
  aside { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; background: #ffc9e2; }
  #info { padding: 10px; font-size: 14px; border-bottom: 1px solid #ff9cc8; }
  #msgs { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { background: #fff0f7; padding: 8px 10px; border-radius: 10px; word-break: break-word; }
  .msg b { display: block; font-size: 12px; color: #d02a78; }
  .reactions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
  .chips { display: contents; }
  .chip, .add-react, .picker button { padding: 2px 8px; border-radius: 12px; background: #ffd6ea; color: #4a1030; font-size: 14px; line-height: 1.5; }
  .chip:hover, .add-react:hover, .picker button:hover { background: #ffb8d9; }
  .chip.mine { background: #ff7eb6; color: #fff; }
  .add-react { opacity: .7; }
  .picker { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .picker[hidden] { display: none; }
  .picker button { font-size: 18px; padding: 2px 6px; }
  form { display: flex; gap: 6px; padding: 10px; }
  form input { flex: 1; font-size: 16px; padding: 10px; border: 0; border-radius: 8px; background: #fff0f7; color: #4a1030; }
  @media (max-width: 800px) {
    header { flex-wrap: wrap; padding: 8px; gap: 6px; }
    header input { flex: 1 1 100%; }
    header button { flex: 1; padding: 10px 8px; font-size: 14px; }
    main { flex-direction: column; }
    #playerWrap { flex: none; width: 100%; aspect-ratio: 16 / 9; }
    aside { width: 100%; flex: 1; min-height: 0; }
    #info { padding: 6px 10px; font-size: 13px; }
    form { padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<header>
  <input id="url" placeholder="Ссылка на YouTube или VK Видео">
  <button id="load">Смотреть</button>
  <button id="copy">Скопировать ссылку на комнату</button>
</header>
<main>
  <div id="playerWrap"><div id="ytBox"><div id="ytPlayer"></div></div><div id="vkBox" style="display:none"></div></div>
  <aside>
    <div id="info">В комнате: <span id="count">1</span></div>
    <div id="msgs"></div>
    <form id="chatForm">
      <input id="chatInput" placeholder="Сообщение..." autocomplete="off" maxlength="500">
      <button>→</button>
    </form>
  </aside>
</main>

<script src="https://vk.ru/js/api/videoplayer.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const roomId = location.pathname.split('/')[2];
let name = localStorage.getItem('wt-name');
if (!name) { name = prompt('Ваше имя?') || 'Гость' + Math.floor(Math.random() * 100); localStorage.setItem('wt-name', name); }

const ytBox = document.getElementById('ytBox');
const vkBox = document.getElementById('vkBox');
let ws, pending = null, active = null, currentKey = null;
let applying = false, applyTimer;
let lastTime = 0, lastTs = Date.now(), lastPlaying = false;

function lockApplying(ms) {
  applying = true;
  clearTimeout(applyTimer);
  applyTimer = setTimeout(() => { applying = false; }, ms || 1200);
}

// ---------- Соединение ----------
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + roomId);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') applyState(m);
    else if (m.type === 'chat') addMsg(m.name, m.text, m.id);
    else if (m.type === 'react') applyReact(m);
    else if (m.type === 'users') document.getElementById('count').textContent = m.count;
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ---------- YouTube ----------
let yt = null, ytReady = false;
function onYouTubeIframeAPIReady() {
  yt = new YT.Player('ytPlayer', {
    width: '100%', height: '100%',
    host: 'https://www.youtube.com',
    playerVars: { playsinline: 1, rel: 0, origin: location.origin },
    events: {
      onReady: () => { ytReady = true; if (pending) { const p = pending; pending = null; applyState(p); } },
      onStateChange: (e) => {
        if (applying) return;
        if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.PAUSED) pushState();
      }
    }
  });
}
const YTA = {
  ready: () => ytReady,
  show() { ytBox.style.display = 'block'; },
  hide() { if (ytReady) yt.pauseVideo(); ytBox.style.display = 'none'; },
  load(id, time, playing) { playing ? yt.loadVideoById(id, time) : yt.cueVideoById(id, time); },
  play() { yt.playVideo(); },
  pause() { yt.pauseVideo(); },
  seek(t) { yt.seekTo(t, true); },
  time() { return yt.getCurrentTime(); },
  isPlaying() { return yt.getPlayerState() === YT.PlayerState.PLAYING; },
  tolerance: 1.5
};

// ---------- VK Видео ----------
let vk = null, vkTime = 0, vkPlaying = false;
function destroyVk() {
  if (vk) { try { vk.destroy(); } catch (e) {} vk = null; }
  vkBox.innerHTML = '';
}
function vkEvent(playing) { vkPlaying = playing; if (!applying) pushState(); }
const VKA = {
  ready: () => typeof VK !== 'undefined' && !!VK.VideoPlayer,
  show() { vkBox.style.display = 'block'; },
  hide() { destroyVk(); vkBox.style.display = 'none'; },
  load(key, time, playing) {
    destroyVk();
    const [oid, id, hash] = key.split('_');
    const f = document.createElement('iframe');
    f.src = 'https://vk.ru/video_ext.php?oid=' + oid + '&id=' + id + (hash ? '&hash=' + hash : '') + '&js_api=1';
    f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
    f.allowFullscreen = true;
    f.style.cssText = 'width:100%;height:100%;border:0';
    vkBox.append(f);
    vk = VK.VideoPlayer(f);
    vkTime = time; vkPlaying = false;
    vk.on('inited', () => {
      lockApplying(2500);
      if (time > 0) vk.seek(time);
      if (playing) vk.play();
    });
    vk.on('timeupdate', (st) => { vkTime = st.time; });
    vk.on('started', () => vkEvent(true));
    vk.on('resumed', () => vkEvent(true));
    vk.on('paused', () => vkEvent(false));
  },
  play() { if (vk) vk.play(); },
  pause() { if (vk) vk.pause(); },
  seek(t) { if (vk) vk.seek(t); },
  time() { return vkTime; },
  isPlaying() { return vkPlaying; },
  tolerance: 2.5   // VK отдаёт время целыми секундами
};

const ADAPTERS = { yt: YTA, vk: VKA };

// ---------- Синхронизация ----------
function applyState(s) {
  if (!s.videoId) return;
  const kind = s.videoId.slice(0, 2), id = s.videoId.slice(3);
  const a = ADAPTERS[kind];
  if (!a) return;
  if (!a.ready()) { pending = s; return; }
  lockApplying();
  if (s.videoId !== currentKey) {
    for (const k in ADAPTERS) if (ADAPTERS[k] !== a) ADAPTERS[k].hide();
    active = a; a.show();
    currentKey = s.videoId;
    a.load(id, s.time, s.playing);
  } else {
    if (Math.abs(a.time() - s.time) > a.tolerance) a.seek(s.time);
    s.playing ? a.play() : a.pause();
  }
  lastTime = s.time; lastTs = Date.now(); lastPlaying = s.playing;
}

function pushState() {
  if (!active) return;
  const t = active.time(), playing = active.isPlaying();
  lastTime = t; lastTs = Date.now(); lastPlaying = playing;
  send({ type: 'state', videoId: currentKey, playing, time: t });
}

// Перемотку определяем по скачку времени
setInterval(() => {
  if (!active || applying || !currentKey) return;
  const cur = active.time();
  const expected = lastPlaying ? lastTime + (Date.now() - lastTs) / 1000 : lastTime;
  if (Math.abs(cur - expected) > active.tolerance) pushState();
}, 500);

// ---------- Разбор ссылок ----------
function parseVideo(u) {
  if (/vk(video)?\.(com|ru)/i.test(u)) {
    let m = u.match(/video(-?\d+)_(\d+)(?:_([0-9a-f]+))?/i);
    if (m) return 'vk:' + m[1] + '_' + m[2] + (m[3] ? '_' + m[3] : '');
    const oid = u.match(/[?&]oid=(-?\d+)/), id = u.match(/[?&]id=(\d+)/), h = u.match(/[?&]hash=([0-9a-f]+)/i);
    if (oid && id) return 'vk:' + oid[1] + '_' + id[1] + (h ? '_' + h[1] : '');
    return null;
  }
  const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? 'yt:' + m[1] : null;
}

document.getElementById('load').onclick = () => {
  const key = parseVideo(document.getElementById('url').value.trim());
  if (!key) return alert('Не удалось распознать ссылку. Поддерживаются YouTube и VK Видео.');
  const s = { videoId: key, playing: true, time: 0 };
  applyState(s);
  send({ type: 'state', ...s });
  document.getElementById('url').value = '';
};
document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(location.href);
  document.getElementById('copy').textContent = 'Скопировано!';
  setTimeout(() => document.getElementById('copy').textContent = 'Скопировать ссылку на комнату', 1500);
};

// ---------- Чат ----------
const EMOJIS = ['❤️', '😂', '😮', '😢', '👍', '🔥', '🥰', '😡'];
let uid = localStorage.getItem('wt-uid');
if (!uid) { uid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('wt-uid', uid); }
const reactions = {};  // msgId -> { emoji -> Set(uid) }
const msgEls = {};     // msgId -> { chips }

function addMsg(n, text, id) {
  const box = document.getElementById('msgs');
  const d = document.createElement('div'); d.className = 'msg';
  const b = document.createElement('b'); b.textContent = n;
  const t = document.createElement('span'); t.textContent = text;
  d.append(b, t);
  if (id) {
    const bar = document.createElement('div'); bar.className = 'reactions';
    const chips = document.createElement('span'); chips.className = 'chips';
    const add = document.createElement('button'); add.type = 'button'; add.className = 'add-react'; add.textContent = '😊+';
    const picker = document.createElement('div'); picker.className = 'picker'; picker.hidden = true;
    EMOJIS.forEach((e) => {
      const x = document.createElement('button'); x.type = 'button'; x.textContent = e;
      x.onclick = () => { sendReact(id, e); picker.hidden = true; };
      picker.append(x);
    });
    add.onclick = () => { picker.hidden = !picker.hidden; };
    bar.append(chips, add);
    d.append(bar, picker);
    msgEls[id] = { chips };
  }
  box.append(d);
  box.scrollTop = box.scrollHeight;
}
function sendReact(msgId, emoji) {
  const set = reactions[msgId] && reactions[msgId][emoji];
  send({ type: 'react', msgId, emoji, uid, on: !(set && set.has(uid)) });
}
function applyReact(m) {
  if (!reactions[m.msgId]) reactions[m.msgId] = {};
  if (!reactions[m.msgId][m.emoji]) reactions[m.msgId][m.emoji] = new Set();
  const set = reactions[m.msgId][m.emoji];
  if (m.on) set.add(m.uid); else set.delete(m.uid);
  renderChips(m.msgId);
}
function renderChips(id) {
  const el = msgEls[id];
  if (!el) return;
  el.chips.innerHTML = '';
  for (const [emoji, set] of Object.entries(reactions[id] || {})) {
    if (!set.size) continue;
    const c = document.createElement('button'); c.type = 'button';
    c.className = 'chip' + (set.has(uid) ? ' mine' : '');
    c.textContent = emoji + ' ' + set.size;
    c.onclick = () => sendReact(id, emoji);
    el.chips.append(c);
  }
}
document.getElementById('chatForm').onsubmit = (e) => {
  e.preventDefault();
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  send({ type: 'chat', name, text });
  inp.value = '';
};

connect();
</script>
</body>
</html>
